version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=database
      - DB_USER=root
      - DB_PASSWORD=instapac_root
      - DB_NAME=instapac_db
      - AD_SERVER_IP=172.31.5.79
      - AD_DOMAIN=instapac.local
      - AD_BASE_DN=DC=instapac,DC=local
    extra_hosts:
      - "instapac.local:172.31.5.79"
    depends_on:
      - database
    restart: unless-stopped

  database:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: instapac_root
      MYSQL_DATABASE: instapac_db
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
